    <!-- Lightbox Overlay -->
    <div class="lightbox" id="lightbox" aria-hidden="true">
        <button class="lightbox-close" aria-label="Close">&times;</button>
        <img class="lightbox-img" src="" alt="">
    </div>

    <script>
        // Lightbox
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = lightbox.querySelector('.lightbox-img');
        const lightboxClose = lightbox.querySelector('.lightbox-close');

        document.addEventListener('click', (e) => {
            const trigger = e.target.closest('[data-lightbox]');
            if (trigger) {
                e.preventDefault();
                lightboxImg.src = trigger.getAttribute('data-lightbox');
                lightboxImg.alt = trigger.getAttribute('alt') || '';
                lightbox.classList.add('lightbox--open');
                lightbox.setAttribute('aria-hidden', 'false');
                document.body.style.overflow = 'hidden';
            }
        });

        const closeLightbox = () => {
            lightbox.classList.remove('lightbox--open');
            lightbox.setAttribute('aria-hidden', 'true');
            document.body.style.overflow = '';
            lightboxImg.src = '';
        };

        lightboxClose.addEventListener('click', closeLightbox);
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) closeLightbox();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
        });

        // Mobile Navigation Toggle
        const menuToggle = document.getElementById('menuToggle');
        const navMenu = document.getElementById('navMenu');

        menuToggle.addEventListener('click', () => {
            const expanded = menuToggle.getAttribute('aria-expanded') === 'true';
            menuToggle.setAttribute('aria-expanded', !expanded);
            navMenu.classList.toggle('active');
            menuToggle.classList.toggle('active');
        });

        // Home hero: header starts at bottom of viewport, scrolls up over hero
        const overlayHeader = document.querySelector('.site-header--overlay');
        const heroSection = document.querySelector('.hero-section');

        if (overlayHeader && heroSection) {
            const updateHeaderState = () => {
                const headerTop = overlayHeader.getBoundingClientRect().top;
                const headerHeight = overlayHeader.offsetHeight;

                // Header is "scrolled" when it's stuck at the top of the viewport
                const isScrolled = headerTop <= 0;
                overlayHeader.classList.toggle('site-header--scrolled', isScrolled);

                if (isScrolled) {
                    // When pinned at top, let CSS handle everything via site-header--scrolled
                    overlayHeader.style.backgroundColor = '';
                    overlayHeader.style.backdropFilter = '';
                    overlayHeader.querySelectorAll('.logo, .nav-link').forEach(el => {
                        el.style.color = '';
                    });
                    let styleEl = document.getElementById('header-underline-style');
                    if (styleEl) styleEl.remove();
                } else {
                    // Header stays white at the bottom of the viewport
                    overlayHeader.style.backgroundColor = '#FAF9F6';
                    overlayHeader.style.backdropFilter = 'none';

                    // Text stays dark on the white header
                    overlayHeader.querySelectorAll('.logo, .nav-link').forEach(el => {
                        el.style.color = '#333333';
                    });
                    // Set underline color via dynamic style element
                    let styleEl = document.getElementById('header-underline-style');
                    if (!styleEl) {
                        styleEl = document.createElement('style');
                        styleEl.id = 'header-underline-style';
                        document.head.appendChild(styleEl);
                    }
                    styleEl.textContent = `.site-header--overlay .nav-link::after { background-color: #333333; }`;
                }
            };

            window.addEventListener('scroll', updateHeaderState, { passive: true });
            window.addEventListener('resize', updateHeaderState);
            updateHeaderState();
        }
    </script>
